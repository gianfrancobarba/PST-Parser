# Annotated corpus: one row per prompt, one column per leaf of the target schema.
# Paths are relative to the repository root.
data:
  source_path: data/raw/prompt_dataset_v2.xlsx
  sheet_name: prompt_dataset_v2
  prompt_column: PROMPT

  # Dotted leaf path in the target schema -> spreadsheet column supplying it.
  # The column headings are those of the delivered spreadsheet, which is an input
  # and stays as it was; only the schema is spelled the way it is documented.
  column_mapping:
    main_instruction: MAIN INSTRUCTION
    context.format: FORMAT
    context.constraints: CONSTRAINS
    context.data: DATA
    context.role: ROLE
    examples: EXAMPLES
    reasoning.influence: INFLUENCE
    reasoning.reasoning_examples: REASONING EXAMPLES
    reasoning.paths: PATHS

  # Departures from the delivered spreadsheet, each with the reason for it.
  fixes_path: data/raw/annotation_fixes.yaml

  processed_dir: data/processed

  # Every record must be made of spans of its own prompt, and account for
  # essentially all of it. A corpus that no longer satisfies this stops the run
  # rather than quietly training on it.
  quality:
    min_coverage_ratio: 0.90
    fail_on_issues: true

  # Three sides, not two: the set watched while training is not the set the
  # results are quoted from. Records sharing a prompt stay on the same side.
  split:
    val_fraction: 0.09
    test_fraction: 0.09
    random_state: 42
    deduplicate: true
    output_dir: data/splits
