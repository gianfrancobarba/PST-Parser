# Deterministic decoding so that repeated evaluations of the same checkpoint
# yield identical predictions.
inference:
  # Sized on the answer, not on the context window. The annotation is
  # extractive, so the answer is of the order of the prompt: the longest one in
  # the corpus is 2487 tokens. Setting this to the width of the window, as it
  # was, left the two competing for the same space and truncated the objects
  # with the longest data field before they could be closed.
  max_new_tokens: 3072
  do_sample: false
  temperature: 0.0
  top_p: 1.0
  structured_output: false
  batch_size: 1

evaluation:
  ted_failure_penalty: 100.0
  confusion_top_k: 5

  # Tried in order when locating a phrase in its prompt. The first accepts only
  # a verbatim match, the second tolerates a different run of whitespace, the
  # third ignores whitespace altogether.
  alignment_levels:
    - exact
    - collapsed
    - stripped
