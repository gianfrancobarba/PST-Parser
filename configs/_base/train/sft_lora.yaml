# Low-rank adaptation of the attention and feed-forward projections, trained
# with supervised fine-tuning on the chat-formatted corpus.
lora:
  r: 16
  alpha: 32
  dropout: 0.0
  bias: none
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
  use_gradient_checkpointing: unsloth
  random_state: 3407

training:
  output_dir: outputs
  per_device_train_batch_size: 2
  per_device_eval_batch_size: 2
  gradient_accumulation_steps: 4
  learning_rate: 2.0e-4
  optim: adamw_8bit
  max_steps: 300
  warmup_steps: 10
  seed: 3407
  eval_strategy: steps
  eval_steps: 50
  logging_steps: 10
  completion_only_loss: false
  load_best_model_at_end: false
  precision: auto
