# Low-rank adaptation of the attention and feed-forward projections, trained
# with supervised fine-tuning on the chat-formatted corpus.
lora:
  r: 16
  alpha: 32
  dropout: 0.0
  bias: none
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
  use_gradient_checkpointing: unsloth

training:
  output_dir: outputs
  per_device_train_batch_size: 2
  per_device_eval_batch_size: 2
  gradient_accumulation_steps: 4
  learning_rate: 2.0e-4
  optim: adamw_8bit
  max_steps: 300
  warmup_steps: 10
  eval_strategy: steps
  eval_steps: 50
  logging_steps: 10
  # The shared system message is most of every training sequence. Teaching the
  # model to reproduce it teaches nothing about segmentation, so the loss is
  # computed on the answer alone. Losses are therefore not comparable with any
  # earlier run: the population the cross-entropy averages over has changed.
  completion_only_loss: true

  # Reporting the last checkpoint measures where training stopped, not where it
  # generalised best. On the reference run the validation loss reached its
  # minimum two thirds of the way through and rose afterwards, and the adapter
  # that was kept was the last one.
  load_best_model_at_end: true

  # Stated rather than derived from whichever device happens to run it, so that
  # the number in the manifest is a decision and not an observation.
  precision: bf16
