# Two profiles, matching the two images.
#
#   docker compose --profile train run --rm train prepare-data -c configs/experiments/baseline.yaml \
#       --set data.processed_dir=outputs/new-run/processed --set data.split.output_dir=outputs/new-run/splits
#   docker compose --profile eval  run --rm score score -c configs/experiments/baseline.yaml \
#       --predictions outputs/new-run/generation/predictions.jsonl --run-dir outputs/new-run/scoring
#
# Each run writes into a fresh outputs/<run>/ directory, as the Makefile's RUN
# variable does; the historical artefacts under results/ are only read.
#
# The training service needs the NVIDIA Container Toolkit on the host. The
# scoring service needs nothing beyond Docker.

name: pstparser

services:
  train:
    profiles: [train]
    # Naming the image explicitly keeps it from diverging from one built by hand.
    image: pstparser:train
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: train
    env_file:
      - path: ../.env
        required: false
    environment:
      HF_HOME: /cache/huggingface
      # Required for deterministic algorithms to be selectable on CUDA.
      CUBLAS_WORKSPACE_CONFIG: ":4096:8"
    volumes:
      - ../data:/workspace/data
      - ../outputs:/workspace/outputs
      - ../results:/workspace/results
      - model-cache:/cache/huggingface
    # The default 64 MB of shared memory is the usual cause of data loader
    # crashes inside containers.
    shm_size: "8gb"
    ulimits:
      memlock: -1
      stack: 67108864
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  score:
    profiles: [eval]
    image: pstparser:eval
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: eval
    volumes:
      - ../data:/workspace/data
      - ../outputs:/workspace/outputs
      - ../results:/workspace/results

volumes:
  model-cache:
