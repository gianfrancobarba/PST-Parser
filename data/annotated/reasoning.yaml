# Prompts generated for the three reasoning paradigms, annotated by hand.
#
# A leaf is named by its path in the taxonomy. A leaf holding several parts of
# the prompt that are not next to each other writes each as its own entry.
# Every segment is a passage of its own prompt, copied exactly, and the
# preparation refuses a record where that is not so.
#
# The paradigm records which group of seeds produced the prompt. It is
# provenance, not structure: where the two disagree, the annotation follows the
# text.

records:
