    \ for low-volume users, may need additional logic for rate limiting based on client IP rather than\
    \ API keys.\n\nOption B: use an off-the-shelf library with an LRU cache to track recent calls.\n \
    \  - How it works: the cache is shared across replicas, with periodic cleanups to evict expired entries.\n\
    \   - Benefits: offloads most complexity, efficient and correct even under network partitions.\n \
    \  - Drawbacks: extra dependency, might be hard to debug when something goes wrong.\n\nOption C: build\
    \ a fully distributed rate limiter on our existing service mesh.\n   - How it works: the mesh reports\
    \ all incoming requests to a central service, which broadcasts updated rate limits back to the mesh\
