  # TO ADD before the freeze F4, once they exist (all committed first):
  # - protocol/guidelines/<gold guidelines, copied by hand>
  # - the BigCodeBench gold of S_gold and the LLMSecEval gold (reviewed, status frozen);
  #   S_gold is the 600-task prefix (protocol/samples/prefix-600/bcb-prefix-600.json), or the
  #   nested 400-task prefix if the prespecified time rule applies (plan of 18/11/2026, P-02).
  #   The BigCodeBench gold is data/annotated/downstream/bcb-gold/annotations.jsonl (the first
  #   600 rows of the bcb-final drafts, same order; its first 400 rows if the fallback applies);
  #   bcb-final keeps the 800 drafts, the draft side of gold-diff
  # - protocol/variants/<benchmark>.variants.jsonl and their render records (T, H-gold, E, F)
  # - protocol/covariates/<benchmark>.covariates.jsonl (output of covariates)
  # - protocol/model.json (generator digests) and protocol/hauto/parser-model.json (parser digests)
  # - protocol/hauto/: the v1 conversion of the pilot tasks read by the C-22 rule (D-01), the
  #   S_parse document of the primary policy on S_gold, its failures, the H-auto variants, the
  #   score results.json of the same predictions and the record of their SHA-256. The prefix is
  #   parsed as a pilot run before F4; the gate report is computed after F4 (parser-gate
  #   --purpose final --freeze --c22), before any analysis: its outcome only applies a frozen rule
  # - protocol/analysis/plan.md, design-*.json and the time rules (checkpoints and prespecified cuts)
  # - protocol/rules/prompt-as-data.md
  # Every other file of the repository is hashed by the freeze itself (protocol-freeze-v2).
