# Freeze specification (freeze-spec-v1). DRAFT: not frozen yet.
# One freeze, F4, before the final generations (plan of 18/11/2026, P-09): gold, samples,
# gate thresholds, parser identity, S_parse and its predictions, model digests, calibrations
# and time rules. Before F4: add the files marked TO ADD, set the pilot block and the
# supervisor acknowledgement (export of messages M1 and M2), commit everything, then run
#   python -m pstparser.empirical freeze --spec protocol/freeze-spec.yaml --out protocol/protocol-freeze.json
# Its SHA-256 goes into the dated email to the supervisor (message M3), which is the
# preregistration: no public registry is used (decision of 19/11/2026).
format: freeze-spec-v1
protocol_version: downstream-1.0.0
frozen_by: studente
supervisor_ack: {messages: [M1, M2], date: null, channel: chat, record: null}
preregistration:
  registry: null
  record: dated email to the supervisor with the SHA-256 of protocol-freeze.json (M3)
  sent_at: null
  export: null
pilot: {run_ids: [ds-pilot-01], report_sha256: "801560af1107c77f01bbe25f28a48133396fe63bb9f991d99020a657b9647881", changelog_sha256: "6fc38dc580444b79a2349e1f592fd9e72e7bcf4894ba9f33aa3c323bb69bbfc6"}
extraction_policies:
  bigcodebench: bigcodebench-sanitize
  llmseceval: python-fenced-blocks-v2
  diagnostic: python-single-block-v1
conditions:
  # Core journal on every task of S_gold; H-auto in the same session, on S_parse only.
  bigcodebench: [T, H-gold, E]
  bigcodebench_s_parse: [H-auto]
  # F in both journals only if the CP3-F time rule admits it (P-11).
  bigcodebench_if_cp3_f: [F]
  llmseceval: [T, H-gold]
renderer_version:
  H-gold: pst-gold-json-v1
  E: envelope-json-v1
  F: pst-flat-json-v1
  H-auto: pst-gold-json-v1
