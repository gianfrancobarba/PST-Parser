# Freeze specification (freeze-spec-v1). DRAFT: not frozen yet.
# Before F4: add the files marked TO ADD, set the pilot block, run
#   python -m pstparser.empirical freeze --spec protocol/freeze-spec.yaml --out protocol/protocol-freeze.json
# and record the SHA-256 of the result in the OSF amendment and in the e-mail to the supervisor.
format: freeze-spec-v1
protocol_version: downstream-1.0.0
frozen_by: studente
supervisor_ack: {date: null, channel: email, record: null}
preregistration: {registry: OSF, phase1_url: null, phase2_amendment_url: null, embargo_until: null}
pilot: {run_ids: [], report_sha256: null, changelog_sha256: null}
extraction_policies:
