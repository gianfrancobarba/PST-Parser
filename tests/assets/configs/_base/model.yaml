model:
  backend: hf
  name: hf-internal-testing/tiny-random-LlamaForCausalLM
  max_seq_length: 512
  load_in_4bit: false
  chat_template: llama-3.1

training:
  max_steps: 2
  warmup_steps: 0
  eval_steps: 1
  logging_steps: 1
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 1
  optim: adamw_torch

inference:
  max_new_tokens: 32
