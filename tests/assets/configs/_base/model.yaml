model:
  backend: hf
  name: hf-internal-testing/tiny-random-LlamaForCausalLM
  max_seq_length: 512
  load_in_4bit: false
  chat_template: llama-3.1

training:
  max_steps: 2
  warmup_steps: 0
  eval_steps: 1
  logging_steps: 1
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 1
  optim: adamw_torch
  # As the shipped recipe trains: the smoke test is worth little if it exercises
  # a different loss from the one the real run computes. Restoring the best
  # checkpoint is here for the same reason, and because the trainer validates
  # that combination when it is built — a mistake in it would otherwise surface
  # only on the accelerator.
  completion_only_loss: true
  load_best_model_at_end: true

inference:
  max_new_tokens: 32
